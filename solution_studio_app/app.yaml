command:
  - "sh"
  - "-c"
  - "gunicorn --preload --bind 0.0.0.0:$DATABRICKS_APP_PORT --workers 2 --worker-class gthread --threads 4 --timeout 180 api:app"

# ── Resources ───────────────────────────────────────────────────────────────────
# Secrets are injected from a Databricks secret scope via `valueFrom` — never
# committed here (ai-dev-kit: "use UC connections or secrets, never hardcode").
#
# Before deploying, create the scope and keys, e.g.:
#   databricks secrets create-scope solution_studio
#   databricks secrets put-secret solution_studio session_secret_key
#   databricks secrets put-secret solution_studio google_credentials_b64
#   databricks secrets put-secret solution_studio anthropic_api_key
#   databricks secrets put-secret solution_studio fin_google_api_key
#
# NOTE: the GCP service-account key previously committed in this file must be
# treated as compromised and ROTATED in GCP before the new value is stored.
resources:
  - name: sql-warehouse
    description: Shared SQL Warehouse for all Solution Studio sub-apps
    sql_warehouse:
      id: 17e5cb93c5f1758e
      permission: CAN_USE

  - name: secret-session-key
    description: Flask session signing key
    secret:
      scope: solution_studio
      key: session_secret_key
      permission: READ

  - name: secret-google-credentials
    description: Base64 GCP service-account JSON for Google Sheets lead logging
    secret:
      scope: solution_studio
      key: google_credentials_b64
      permission: READ

  - name: secret-anthropic-api-key
    description: Anthropic API key for Claude briefings and vertical classification
    secret:
      scope: solution_studio
      key: anthropic_api_key
      permission: READ

  - name: secret-google-api-key
    description: Google Generative AI (Gemini) API key for finance briefings
    secret:
      scope: solution_studio
      key: fin_google_api_key
      permission: READ

env:
  # ── Secrets (injected from the scope declared above) ────────────────────────
  - name: SECRET_KEY
    valueFrom: secret-session-key
  - name: GOOGLE_CREDENTIALS_B64
    valueFrom: secret-google-credentials
  - name: ANTHROPIC_API_KEY
    valueFrom: secret-anthropic-api-key
  - name: FIN_GOOGLE_API_KEY
    valueFrom: secret-google-api-key

  # ── Shared ──────────────────────────────────────────────────────────────────
  - name: DATABRICKS_HOST
    value: "https://fevm-solution-studio.cloud.databricks.com"
  - name: COMPANY_NAME
    value: ""
  - name: ENERGY_APP_URL
    value: ""
  - name: LOG_SHEET_ID
    value: "1IcUqjBdtb__MHmgozi2RgsVzmizN_SUZp0Fdt8ympDs"

  # ── Supply Chain (/supply-chain/) ───────────────────────────────────────────
  - name: SC_GENIE_SPACE_ID
    value: "01f14ba20d4418d280e60f29772adfe6"
  - name: SC_LLM_ENDPOINT
    value: "databricks-meta-llama-3-3-70b-instruct"
  - name: SC_SQL_WAREHOUSE_HTTP_PATH
    value: "/sql/1.0/warehouses/17e5cb93c5f1758e"

  # ── Manufacturing (/manufacturing/) ─────────────────────────────────────────
  - name: MFG_GENIE_SPACE_ID
    value: ""
  - name: MFG_LLM_ENDPOINT
    value: "databricks-meta-llama-3-3-70b-instruct"
  - name: MFG_SQL_WAREHOUSE_HTTP_PATH
    value: "/sql/1.0/warehouses/17e5cb93c5f1758e"
  - name: MFG_VISION_ENDPOINT
    value: "vision"
  - name: MFG_PDM_ENDPOINT
    value: "predictive-maintenance"
  - name: MFG_MANUALS_ENDPOINT
    value: "mfg-manuals-rag"
  - name: MFG_UC_CATALOG
    value: "solution_studio_catalog"
  - name: MFG_UC_SCHEMA
    value: "mfg_vision"
  - name: MFG_UC_VOLUME
    value: "inspection_images"

  # ── Finance (/finance/) ──────────────────────────────────────────────────────
  - name: FIN_GENIE_SPACE_ID
    value: ""
  - name: FIN_WAREHOUSE_ID
    value: "17e5cb93c5f1758e"
  - name: FIN_CATALOG
    value: "solution_studio_catalog"
  - name: FIN_GOLD_SCHEMA
    value: "finance_gold"
