command:
  - gunicorn
  - --bind
  - "0.0.0.0:$DATABRICKS_APP_PORT"
  - --workers
  - "2"
  - --timeout
  - "120"
  - app:app

env:
  - name: DATABRICKS_WAREHOUSE_ID
    value: "23720e4bb845c623"
  - name: DEFAULT_CATALOG
    value: "demo_nah_catalog"
  - name: DEFAULT_SCHEMA
    value: "wabash"
  - name: QUERY_ROW_LIMIT
    value: "500"

resources:
  - name: sql-warehouse
    description: SQL Warehouse for dashboard queries
    sql_warehouse:
      permission: CAN_USE
