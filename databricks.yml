  dashboards:
    sap_orders_delivery:
      display_name: SAP Orders and Delivery
      file_path: resources/dashboards/sap_orders_delivery.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
    sap_procurement_inventory:
      display_name: SAP Procurement and Inventory
      file_path: resources/dashboards/sap_procurement_inventory.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
    qad_oee:
      display_name: QAD OEE
      file_path: resources/dashboards/qad_oee.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
  apps:
    novelis_dashboard:
      name: novelis-sc-oee-dashboard
      source_code_path: app/novelis_dashboard
      description: Supply chain and production OEE dashboard from gold tables (serverless_hadnqm_catalog / ai_sc_test)

targets:
  dev:
    default: true
    workspace:
      host: https://fevm-serverless-hadnqm.cloud.databricks.com/
    variables:
      catalog: serverless_hadnqm_catalog
      schema: ai_sc_test
      # Set your SQL warehouse ID for Lakeview dashboards (SQL > Warehouses > copy ID).
      warehouse_id: ""
