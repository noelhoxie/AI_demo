      name: novelis-sc-oee-dashboard
      source_code_path: novelis_dashboard
      description: Supply chain and production OEE dashboard from gold tables (serverless_hadnqm_catalog / ai_sc_test)
    supply_chain_dashboard:
      name: supply-chain-dashboard
      source_code_path: supply_chain_dashboard
      description: SAP and QAD gold dashboard with comments (Orders, Procurement, Inventory & Delivery, Production OEE)

targets:
  dev:
    default: true
    workspace:
      host: https://fevm-serverless-hadnqm.cloud.databricks.com/
    variables:
