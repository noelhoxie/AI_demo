# Databricks Asset Bundle — Supply Chain Control Tower
# Deploys to https://fevm-serverless-hadnqm.cloud.databricks.com/
# Catalog: serverless_hadnqm_catalog, Schema: ai_sc_test
# See: https://docs.databricks.com/en/dev-tools/bundles/

bundle:
  name: supply-chain-control-tower

variables:
  catalog:
    default: serverless_hadnqm_catalog
  schema:
    default: ai_sc_test

resources:
  jobs:
    SAP_bronze_ingest:
      name: SAP_bronze_ingest
      queue:
        enabled: true
      tasks:
        - task_key: bronze_ekko
          notebook_task:
            notebook_path: databricks/notebooks/sap/bronze_ekko.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: bronze_ekpo
          notebook_task:
            notebook_path: databricks/notebooks/sap/bronze_ekpo.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: bronze_vbak
          notebook_task:
            notebook_path: databricks/notebooks/sap/bronze_vbak.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: bronze_vbap
          notebook_task:
            notebook_path: databricks/notebooks/sap/bronze_vbap.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: bronze_likp
          notebook_task:
            notebook_path: databricks/notebooks/sap/bronze_likp.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: bronze_lips
          notebook_task:
            notebook_path: databricks/notebooks/sap/bronze_lips.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: bronze_mard
          notebook_task:
            notebook_path: databricks/notebooks/sap/bronze_mard.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: bronze_aufk
          notebook_task:
            notebook_path: databricks/notebooks/sap/bronze_aufk.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: silver_procurement
          notebook_task:
            notebook_path: databricks/notebooks/sap/silver_procurement.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          depends_on:
            - task_key: bronze_ekko
            - task_key: bronze_ekpo
        - task_key: silver_orders
          notebook_task:
            notebook_path: databricks/notebooks/sap/silver_orders.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          depends_on:
            - task_key: bronze_vbak
