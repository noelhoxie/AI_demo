<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>App Portal — Databricks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0d;
      --bg-card:   #141414;
      --bg-hover:  #1a1a1a;
      --border:    rgba(255,255,255,0.08);
      --border-hi: rgba(255,255,255,0.15);
      --text-1:    #f0f0f0;
      --text-2:    #c8c8c8;
      --text-3:    #6b7280;
      --red:       #FF3621;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-1);
      font-family: Inter, system-ui, sans-serif;
    }

    /* ── subtle grid bg ── */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 52px 52px;
    }

    /* ── header ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,13,13,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
    }

    .header-brand {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }

    .header-brand-name {
      font-size: 15px; font-weight: 700; color: var(--text-1);
    }
    .header-brand-sub {
      font-size: 11px; color: var(--text-3);
      border-left: 1px solid var(--border); padding-left: 10px; margin-left: 2px;
    }

    .header-right {
      display: flex; align-items: center; gap: 14px;
    }
    .header-email {
      font-size: 12px; color: var(--text-3);
    }
    .logout-btn {
      font-size: 12px; color: var(--text-3); background: none; border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 12px; cursor: pointer; font-family: inherit;
      transition: all .15s;
    }
    .logout-btn:hover { color: var(--text-1); border-color: var(--border-hi); }

    /* ── hero ── */
    .hero {
      padding: 64px 40px 48px;
      text-align: center;
      position: relative;
    }

    /* glow orb behind hero */
    .hero::before {
      content: '';
      position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(27,111,235,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text-3);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 4px 14px; margin-bottom: 20px;
    }
    .hero-eyebrow-dot {
      width: 6px; height: 6px; border-radius: 50%; background: #10b981;
    }

    .hero-title {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 800; line-height: 1.15;
      color: var(--text-1);
      margin-bottom: 14px;
    }
    .hero-title span { color: var(--red); }

    .hero-sub {
      font-size: 15px; color: var(--text-3); line-height: 1.6;
      max-width: 520px; margin: 0 auto 8px;
    }

    /* ── cards grid ── */
    .cards-section {
      padding: 0 40px 80px;
      max-width: 1200px; margin: 0 auto;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    @media (max-width: 900px) { .cards-grid { grid-template-columns: 1fr; } }
    @media (max-width: 1100px) and (min-width: 901px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }

    .app-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      display: flex; flex-direction: column;
      transition: border-color .2s, box-shadow .2s, transform .2s;
      position: relative; overflow: hidden;
    }
    .app-card:hover {
      border-color: var(--card-color, #1B6FEB);
      box-shadow: 0 0 0 1px var(--card-color, #1B6FEB),
                  0 20px 60px rgba(0,0,0,0.4);
      transform: translateY(-2px);
    }
    /* top accent bar */
    .app-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--card-color, #1B6FEB);
      border-radius: 16px 16px 0 0;
    }

    .card-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-icon {
      width: 44px; height: 44px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .card-badge {
      font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      padding: 3px 9px; border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-3);
    }
    .card-badge.active {
      background: rgba(16,185,129,0.1);
      border-color: rgba(16,185,129,0.3);
      color: #10b981;
    }

    .card-name {
      font-size: 18px; font-weight: 700; color: var(--text-1);
      margin-bottom: 4px; line-height: 1.25;
    }
    .card-tagline {
      font-size: 11px; font-weight: 600; letter-spacing: .05em;
      text-transform: uppercase; color: var(--text-3);
      margin-bottom: 14px;
    }
    .card-desc {
      font-size: 13.5px; color: var(--text-2); line-height: 1.65;
      margin-bottom: 20px; flex: 1;
    }

    .card-features {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 24px;
    }
    .card-feature {
      font-size: 11px; color: var(--text-3);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 5px; padding: 3px 8px;
    }

    .card-launch {
      width: 100%; padding: 11px;
      font-size: 14px; font-weight: 600; font-family: inherit;
      border: none; border-radius: 9px; cursor: pointer;
      background: var(--card-color, #1B6FEB);
      color: #fff;
      transition: opacity .15s;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .card-launch:hover { opacity: .88; }
    .card-launch:disabled {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-3);
      cursor: not-allowed;
      opacity: 1;
    }

    /* ── skeleton loader ── */
    .skeleton { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.9} }
    .skel-block {
      background: rgba(255,255,255,0.07);
      border-radius: 6px; display: block;
    }

    /* ── footer ── */
    .footer {
      border-top: 1px solid var(--border);
      padding: 18px 40px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 11.5px; color: var(--text-3);
    }
    .footer strong { color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header class="header">
  <div class="header-brand">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="26" height="26">
      <rect width="48" height="48" rx="10" fill="#1A0500"/>
      <path d="M24 8L8 17v8l16 9 16-9v-8L24 8z" fill="#FF3621"/>
      <path d="M8 25v8l16 9 16-9v-8l-16 9-16-9z" fill="#FF6B35" opacity="0.8"/>
    </svg>
    <span class="header-brand-name" id="header-company">App Portal</span>
    <span class="header-brand-sub">Powered by Databricks</span>
  </div>
  <div class="header-right">
    <span class="header-email" id="header-email"></span>
    <a href="/logout"><button class="logout-btn">Sign out</button></a>
  </div>
</header>

<!-- ── Hero ────────────────────────────────────────────────────────────────── -->
<section class="hero">
  <div class="hero-eyebrow">
    <span class="hero-eyebrow-dot"></span>
    Databricks Data Intelligence Platform
  </div>
  <h1 class="hero-title">
    Welcome to <span id="hero-company">your portal</span>
  </h1>
  <p class="hero-sub">
    Select an application below. Each is powered by Databricks — Delta Lake, SQL Warehouse, and AI — built for your data.
  </p>
</section>

<!-- ── App Cards ───────────────────────────────────────────────────────────── -->
<section class="cards-section">
  <div class="cards-grid" id="cards-grid">
    <!-- skeleton while loading -->
    <div class="app-card skeleton">
      <div style="display:flex;justify-content:space-between;margin-bottom:20px;">
        <span class="skel-block" style="width:44px;height:44px;border-radius:10px;"></span>
        <span class="skel-block" style="width:80px;height:22px;border-radius:999px;"></span>
      </div>
      <span class="skel-block" style="width:60%;height:18px;margin-bottom:8px;"></span>
      <span class="skel-block" style="width:40%;height:12px;margin-bottom:16px;"></span>
      <span class="skel-block" style="width:100%;height:60px;margin-bottom:20px;"></span>
      <span class="skel-block" style="width:100%;height:40px;border-radius:9px;"></span>
    </div>
    <div class="app-card skeleton">
      <div style="display:flex;justify-content:space-between;margin-bottom:20px;">
        <span class="skel-block" style="width:44px;height:44px;border-radius:10px;"></span>
        <span class="skel-block" style="width:80px;height:22px;border-radius:999px;"></span>
      </div>
      <span class="skel-block" style="width:55%;height:18px;margin-bottom:8px;"></span>
      <span class="skel-block" style="width:35%;height:12px;margin-bottom:16px;"></span>
      <span class="skel-block" style="width:100%;height:60px;margin-bottom:20px;"></span>
      <span class="skel-block" style="width:100%;height:40px;border-radius:9px;"></span>
    </div>
    <div class="app-card skeleton">
      <div style="display:flex;justify-content:space-between;margin-bottom:20px;">
        <span class="skel-block" style="width:44px;height:44px;border-radius:10px;"></span>
        <span class="skel-block" style="width:80px;height:22px;border-radius:999px;"></span>
      </div>
      <span class="skel-block" style="width:65%;height:18px;margin-bottom:8px;"></span>
      <span class="skel-block" style="width:45%;height:12px;margin-bottom:16px;"></span>
      <span class="skel-block" style="width:100%;height:60px;margin-bottom:20px;"></span>
      <span class="skel-block" style="width:100%;height:40px;border-radius:9px;"></span>
    </div>
  </div>
</section>

<!-- ── Footer ──────────────────────────────────────────────────────────────── -->
<footer class="footer">
  <svg width="14" height="14" viewBox="0 0 48 48" fill="none">
    <rect width="48" height="48" rx="8" fill="#1A0500"/>
    <path d="M24 8L8 17v8l16 9 16-9v-8L24 8z" fill="#FF3621"/>
    <path d="M8 25v8l16 9 16-9v-8l-16 9-16-9z" fill="#FF6B35" opacity="0.8"/>
  </svg>
  <span>Powered by <strong>Databricks</strong> — Delta Lake · SQL Warehouse · Genie AI · Lakebase</span>
</footer>

<script>
// ── App icons (inline SVG per category) ────────────────────────────────────
const ICONS = {
  '#1B6FEB': `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B6FEB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  '#10b981': `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,
  '#8b5cf6': `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  '#f59e0b': `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
  '#f97316': `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`,
};
const DEFAULT_ICON = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`;

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCards(apps) {
  const grid = document.getElementById('cards-grid');
  grid.innerHTML = apps.map(app => {
    const color   = app.color || '#1B6FEB';
    const hasUrl  = app.url && app.url.trim() !== '';
    const icon    = ICONS[color] || DEFAULT_ICON;
    const badgeClass = hasUrl ? 'active' : '';
    const features = (app.features || []).filter(f => f.trim());

    return `
      <div class="app-card" style="--card-color:${esc(color)}">
        <div class="card-top">
          <div class="card-icon">${icon}</div>
          ${app.badge ? `<span class="card-badge ${badgeClass}">${esc(app.badge)}</span>` : ''}
        </div>
        <div class="card-name">${esc(app.name)}</div>
        ${app.tagline ? `<div class="card-tagline">${esc(app.tagline)}</div>` : ''}
        <div class="card-desc">${esc(app.desc)}</div>
        ${features.length ? `
          <div class="card-features">
            ${features.map(f => `<span class="card-feature">${esc(f)}</span>`).join('')}
          </div>` : ''}
        <button class="card-launch"
          ${hasUrl ? `onclick="launch('${esc(app.url)}')"` : 'disabled'}
          style="${hasUrl ? `background:${esc(color)}` : ''}">
          ${hasUrl
            ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
               Launch App`
            : 'Coming Soon'}
        </button>
      </div>`;
  }).join('');
}

function launch(url) {
  // Internal URLs open in same tab; external Databricks Apps open in new tab
  if (url.startsWith('http')) {
    window.open(url, '_blank', 'noopener');
  } else {
    window.location.href = url;
  }
}

async function init() {
  try {
    const d = await (await fetch('/api/config')).json();

    // Update branding
    const company = d.company_name || 'Your Portal';
    document.title = company + ' — App Portal';
    document.getElementById('header-company').textContent = company;
    document.getElementById('hero-company').textContent   = company;
    if (d.email) document.getElementById('header-email').textContent = d.email;

    // Render app cards
    if (d.apps && d.apps.length) renderCards(d.apps);
  } catch (e) {
    document.getElementById('cards-grid').innerHTML =
      `<div style="color:#6b7280;font-size:14px;padding:32px 0;">Could not load app configuration. Please refresh.</div>`;
  }
}

init();
</script>
</body>
</html>
