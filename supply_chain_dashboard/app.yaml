# Databricks App spec — Supply Chain Dashboard (SAP + QAD gold, Postgres comments)
command:
  - gunicorn
  - "--bind"
  - "0.0.0.0:$DATABRICKS_APP_PORT"
  - "--workers"
  - "2"
  - "--timeout"
  - "120"
  - app:app

env:
  - name: CATALOG
    value: serverless_hadnqm_catalog
  - name: SCHEMA
    value: ai_sc_test

resources:
  - name: sql-warehouse
    description: SQL Warehouse for querying gold tables
    sql_warehouse:
      permission: CAN_USE
