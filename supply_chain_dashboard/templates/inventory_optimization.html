{% extends "dashboard_base.html" %}

{% block content %}
<section class="panel active">
  <div class="panel-content" id="inventory-optimization-panel">
    <div class="filters-bar">
      <span class="filter-count" id="inventory-filter-count"></span>
      <button type="button" class="btn btn-secondary btn-refresh" id="inventory-refresh" aria-label="Refresh data">Refresh</button>
    </div>
    <div class="kpi-row" id="inventory-kpis">
      <div class="kpi-card"><div class="label">Inventory turnover</div><div class="value" id="kpi-turnover">—</div></div>
      <div class="kpi-card"><div class="label">Days of supply</div><div class="value" id="kpi-days-supply">—</div></div>
      <div class="kpi-card"><div class="label">Service level %</div><div class="value percent" id="kpi-service-level">—</div></div>
      <div class="kpi-card"><div class="label">Stockouts (30d)</div><div class="value" id="kpi-stockouts">—</div></div>
      <div class="kpi-card"><div class="label">Safety stock (days)</div><div class="value" id="kpi-safety-days">—</div></div>
    </div>
    <div class="charts-row">
      <div class="chart-card">
        <h3>Inventory value by location</h3>
        <div class="chart-container" style="height: 300px;"><canvas id="chart-inventory-location"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Inventory value by ABC class</h3>
        <div class="chart-container" style="height: 300px;"><canvas id="chart-inventory-abc"></canvas></div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
(function() {
  const BAR_COLORS = ['#002855', '#0072CE', '#00A3E0', '#4DA6FF', '#5A6C7D', '#00854D', '#C9A227'];
  function formatNum(x) { return Number(x).toLocaleString(); }
  function formatMoney(x) { return '$' + formatNum(Math.round(x)); }
  let locationChart = null;
  let abcChart = null;

  function setKpis(k) {
    const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val ?? '—'; };
    set('kpi-turnover', k.inventory_turnover != null ? String(k.inventory_turnover) : null);
    set('kpi-days-supply', k.days_of_supply != null ? formatNum(k.days_of_supply) : null);
    set('kpi-service-level', k.service_level_pct != null ? k.service_level_pct + '%' : null);
    set('kpi-stockouts', k.stockout_events_30d != null ? formatNum(k.stockout_events_30d) : null);
    set('kpi-safety-days', k.safety_stock_coverage_days != null ? formatNum(k.safety_stock_coverage_days) : null);
  }

  function renderCharts(data) {
    const byLocation = data.inventory_by_location || [];
    const canvasLoc = document.getElementById('chart-inventory-location');
    if (locationChart) { locationChart.destroy(); locationChart = null; }
    if (canvasLoc && byLocation.length && typeof Chart !== 'undefined') {
      locationChart = new Chart(canvasLoc.getContext('2d'), {
        type: 'bar',
        data: {
          labels: byLocation.map(x => x.location),
          datasets: [{ label: 'Value', data: byLocation.map(x => x.value), backgroundColor: BAR_COLORS }]
        },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true } } }
      });
    }

    const byAbc = data.inventory_by_abc_class || [];
    const canvasAbc = document.getElementById('chart-inventory-abc');
    if (abcChart) { abcChart.destroy(); abcChart = null; }
    if (canvasAbc && byAbc.length && typeof Chart !== 'undefined') {
      abcChart = new Chart(canvasAbc.getContext('2d'), {
        type: 'bar',
        data: {
          labels: byAbc.map(x => 'Class ' + x.class),
          datasets: [{ label: 'Value %', data: byAbc.map(x => x.value_pct), backgroundColor: BAR_COLORS }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } }
      });
    }

    const countEl = document.getElementById('inventory-filter-count');
    if (countEl) countEl.textContent = byLocation.length ? byLocation.length + ' locations' : '';
  }

  function loadData() {
    const panel = document.getElementById('inventory-optimization-panel');
    if (panel) panel.classList.add('is-loading');
    fetch('/api/inventory-optimization').then(r => r.json()).then(d => {
      setKpis(d.kpis || {});
      renderCharts(d);
    }).catch(() => {}).finally(() => { if (panel) panel.classList.remove('is-loading'); });
  }

  loadData();
  document.getElementById('inventory-refresh')?.addEventListener('click', loadData);
})();
</script>
{% endblock %}
