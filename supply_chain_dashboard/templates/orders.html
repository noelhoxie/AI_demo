{% extends "dashboard_base.html" %}

{% block content %}
<section class="panel active">
  <div class="panel-content">
    <div class="kpi-row" id="orders-kpis">
      <div class="kpi-card"><div class="label">Total Orders</div><div class="value" id="kpi-orders-total">—</div><div class="target" id="kpi-orders-total-target"></div></div>
      <div class="kpi-card"><div class="label">Order Value</div><div class="value money" id="kpi-orders-value">—</div><div class="target" id="kpi-orders-value-target"></div></div>
      <div class="kpi-card"><div class="label">Avg Order Value</div><div class="value money" id="kpi-orders-avg">—</div><div class="target" id="kpi-orders-avg-target"></div></div>
      <div class="kpi-card"><div class="label">Total Quantity</div><div class="value" id="kpi-orders-qty">—</div><div class="target" id="kpi-orders-qty-target"></div></div>
      <div class="kpi-card"><div class="label">Unique Customers</div><div class="value" id="kpi-orders-customers">—</div><div class="target" id="kpi-orders-customers-target"></div></div>
    </div>
    <div class="charts-row">
      <div class="chart-card"><h3>Orders by Status</h3><div class="chart-container"><canvas id="chart-orders-status"></canvas></div></div>
    </div>
  </div>
  <div class="comments-section" id="comments-section" data-tab="orders">
    <h3>Comments</h3>
    <div class="comments-list" id="comments-orders"></div>
    <div class="comment-form">
      <label for="comment-text-orders">Add comment</label>
      <textarea id="comment-text-orders" placeholder="Enter a comment..."></textarea>
      <div class="actions"><button type="button" class="btn btn-primary" data-tab="orders">Save</button></div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
(function() {
  function setOrdersKpis(k) {
    const el = id => document.getElementById(id);
    if (el('kpi-orders-total')) el('kpi-orders-total').textContent = formatNum(k.total_orders ?? '—');
    if (el('kpi-orders-value')) el('kpi-orders-value').textContent = k.total_order_value != null ? formatMoney(k.total_order_value) : '—';
    if (el('kpi-orders-avg')) el('kpi-orders-avg').textContent = k.avg_order_value != null ? formatMoney(k.avg_order_value) : '—';
    if (el('kpi-orders-qty')) el('kpi-orders-qty').textContent = formatNum(k.total_order_qty ?? '—');
    if (el('kpi-orders-customers')) el('kpi-orders-customers').textContent = formatNum(k.unique_customers ?? '—');
    if (el('kpi-orders-total-target')) el('kpi-orders-total-target').textContent = k.total_orders_target != null ? 'Target: ' + formatNum(k.total_orders_target) : '';
    if (el('kpi-orders-value-target')) el('kpi-orders-value-target').textContent = k.total_order_value_target != null ? 'Target: ' + formatMoney(k.total_order_value_target) : '';
    if (el('kpi-orders-avg-target')) el('kpi-orders-avg-target').textContent = k.avg_order_value_target != null ? 'Target: ' + formatMoney(k.avg_order_value_target) : '';
    if (el('kpi-orders-qty-target')) el('kpi-orders-qty-target').textContent = k.total_order_qty_target != null ? 'Target: ' + formatNum(k.total_order_qty_target) : '';
    if (el('kpi-orders-customers-target')) el('kpi-orders-customers-target').textContent = k.unique_customers_target != null ? 'Target: ' + formatNum(k.unique_customers_target) : '';
  }
  function loadData() {
    const payload = window.__simulatedPayload;
    if (payload && payload.orders) {
      const o = payload.orders;
      const k = o.kpis || {};
      setOrdersKpis(k);
      const el = id => document.getElementById(id);
      const statusData = o.orders_by_status || [];
      const canvas = el('chart-orders-status');
      if (canvas && statusData.length && typeof Chart !== 'undefined') {
        new Chart(canvas.getContext('2d'), {
          type: 'bar',
          data: { labels: statusData.map(x => x.status), datasets: [{ label: 'Orders', data: statusData.map(x => x.count), backgroundColor: BAR_COLORS }] },
          options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true } } }
        });
      }
      return;
    }
    fetch('/api/orders').then(r => r.json()).then(d => {
      const k = d.kpis || {};
      setOrdersKpis(k);
      const el = id => document.getElementById(id);
      const statusData = d.orders_by_status || [];
      const canvas = el('chart-orders-status');
      if (canvas && statusData.length && typeof Chart !== 'undefined') {
        new Chart(canvas.getContext('2d'), {
          type: 'bar',
          data: { labels: statusData.map(x => x.status), datasets: [{ label: 'Orders', data: statusData.map(x => x.count), backgroundColor: BAR_COLORS }] },
          options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true } } }
        });
      }
    }).catch(() => {});
  }
  try { var sim = sessionStorage.getItem('simulatedPayload'); if (sim) window.__simulatedPayload = JSON.parse(sim); } catch (e) {}
  loadData();
  function renderComments(list) {
    const el = document.getElementById('comments-orders');
    if (!el) return;
    if (!list.length) { el.innerHTML = '<p class="empty-state">No comments yet.</p>'; return; }
    el.innerHTML = list.map(c => {
      const meta = (c.author_name ? escapeHtml(c.author_name) + ' — ' : '') + (c.created_at || '');
      return '<div class="comment-item"><div>' + escapeHtml(c.content) + '</div><div class="meta">' + meta + '</div></div>';
    }).join('');
  }
  fetch('/api/comments?tab=orders').then(r => r.json()).then(renderComments).catch(() => {});
  document.querySelector('.comment-form .btn-primary[data-tab="orders"]')?.addEventListener('click', () => {
    const textarea = document.getElementById('comment-text-orders');
    const content = (textarea && textarea.value || '').trim();
    if (!content) return;
    const btn = document.querySelector('.comment-form .btn-primary[data-tab="orders"]');
    if (btn) btn.disabled = true;
    fetch('/api/comments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tab: 'orders', content: content }) })
      .then(r => { if (btn) btn.disabled = false; if (r.ok) { textarea.value = ''; fetch('/api/comments?tab=orders').then(r => r.json()).then(renderComments); } })
      .catch(() => { if (btn) btn.disabled = false; });
  });
})();
</script>
{% endblock %}
